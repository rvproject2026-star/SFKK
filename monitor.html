<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitor Matrix</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Consolas, Monaco, monospace;
      margin: 0;
      padding: 20px;
      background-color: #050505;
      color: #00ff66;
    }

    h2 {
      text-align: center;
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    hr {
      max-width: 1100px;
      margin-bottom: 25px;
      border: 0;
      border-top: 1px solid #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #00ff66;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 320px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
    }

    h3 {
      color: #00ff66;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
    }

    .info-text {
      font-size: 13px;
      color: #00cc52;
      margin-top: 8px;
    }

    /* PETA LEAFLET DARK VERSION */
    #map {
      height: 350px;
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #00ff66;
      cursor: pointer; /* Indikator bahwa peta bisa diklik */
    }

    /* TAMPILAN KAMERA FULL SAMESIZE */
    .stream-box {
      width: 100%;
      height: 350px;
      background-color: #000;
      border: 1px solid #00ff66;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 10px;
    }

    img#streamImage {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Memenuhi kotak secara penuh */
    }

    /* BADGE STATUS */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-online {
      background-color: #003311;
      color: #00ff66;
      border: 1px solid #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    .status-offline {
      background-color: #330000;
      color: #ff3333;
      border: 1px solid #ff3333;
    }

    /* TOMBOL BUKA GOOGLE MAPS */
    .btn-gmaps {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #003311;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .btn-gmaps:hover {
      background-color: #00ff66;
      color: #000;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
    }
  </style>
</head>
<body>

  <h2>[ SYSTEM MONITORING DEVICE ]</h2>
  <hr>

  <div class="container">
    
    <div class="card">
      <h3>
        <span>📍 LOKASI TARGET</span>
        <span id="statusLokasi" class="status-badge status-offline">OFFLINE</span>
      </h3>
      <p id="coords" class="info-text">Koordinat: Waiting data...</p>
      <p id="lastUpdateLoc" class="info-text">Update Terakhir: -</p>
      
      <div id="map" title="Klik peta untuk buka di Google Maps"></div>
      
      <a id="btnGmaps" href="#" target="_blank" class="btn-gmaps" style="display: none;">
        🗺️ Buka di Google Maps
      </a>
    </div>

    <div class="card">
      <h3>
        <span>📷 STREAM KAMERA</span>
        <span id="statusKamera" class="status-badge status-offline">OFFLINE</span>
      </h3>
      <p class="info-text">Live Capture Visual Target:</p>
      
      <div class="stream-box">
        <img id="streamImage" src="" alt="Waiting Stream..." style="display: none;">
        <span id="placeholderText" style="color: #00cc52;">[ KAMERA INAKTIF ]</span>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyC5FzkrFW7JPOagOddT575F44wVT6hVeRE",
      authDomain: "sfkk-6af70.firebaseapp.com",
      databaseURL: "https://sfkk-6af70-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sfkk-6af70",
      storageBucket: "sfkk-6af70.firebasestorage.app",
      messagingSenderId: "1045663352487",
      appId: "1:1045663352487:web:3948f3c0a8f1e215187d82",
      measurementId: "G-23SNFYWR8V"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Variable Simpan Koordinat Terbaru
    let currentLat = -6.200000;
    let currentLng = 106.816666;

    // 2. Inisialisasi Peta Leaflet (Versi Dark Tile CartoDB)
    const map = L.map('map').setView([currentLat, currentLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);


    let marker = L.marker([currentLat, currentLng]).addTo(map)
      .bindPopup('Posisi Target')
      .openPopup();

    // 3. FITUR KLIK PETA UNTUK BUKA GOOGLE MAPS
    function bukaGoogleMaps() {
      if (currentLat && currentLng) {
        const gmapsUrl = `https://www.google.com/maps?q=${currentLat},${currentLng}`;
        window.open(gmapsUrl, '_blank');
      }
    }

    // Klik pada area peta langsung membuka Google Maps
    map.on('click', bukaGoogleMaps);

    // 4. LISTEN DATA LOKASI REALTIME
    db.ref('device/location').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.latitude && data.longitude) {
        currentLat = data.latitude;
        currentLng = data.longitude;
        const time = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : '-';

        document.getElementById('coords').innerText = `Koordinat: ${currentLat}, ${currentLng}`;
        document.getElementById('lastUpdateLoc').innerText = `Update Terakhir: ${time}`;

        const badge = document.getElementById('statusLokasi');
        badge.innerText = "ONLINE";
        badge.className = "status-badge status-online";

        // Tampilkan tombol Google Maps & atur linknya
        const btnGmaps = document.getElementById('btnGmaps');
        btnGmaps.href = `https://www.google.com/maps?q=${currentLat},${currentLng}`;
        btnGmaps.style.display = 'inline-block';

        // Update Posisi Peta
        const newPos = [currentLat, currentLng];
        map.setView(newPos, 16);
        marker.setLatLng(newPos);
      }
    });

    // 5. LISTEN DATA KAMERA REALTIME
    db.ref('device/cameraFrame').on('value', (snapshot) => {
      const base64Image = snapshot.val();
      const imgElem = document.getElementById('streamImage');
      const placeholder = document.getElementById('placeholderText');
      const badge = document.getElementById('statusKamera');

      if (base64Image) {
        imgElem.src = base64Image;
        imgElem.style.display = 'block';
        placeholder.style.display = 'none';

        badge.innerText = "LIVE";
        badge.className = "status-badge status-online";
      } else {
        imgElem.style.display = 'none';
        placeholder.style.display = 'block';
        badge.innerText = "OFFLINE";
        badge.className = "status-badge status-offline";
      }
    });
  </script>

</body>
</html>
